  - name: Set up git
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

  - name: List zip files
    run: |
      echo "Looking for .zip files in the repository root..."
      ls -la || true
      shopt -s nullglob
      ZIPS=( *.zip )
      if [ ${#ZIPS[@]} -eq 0 ]; then
        echo "No zip files found in repository root. Exiting with success (nothing to extract)."
        exit 0
      fi
      printf "%s\n" "${ZIPS[@]}"

  - name: Extract ZIPs
    run: |
      set -euo pipefail
      mkdir -p extracted
      for f in *.zip; do
        echo "Processing $f"
        name="${f%.*}"
        dest="extracted/$name"
        mkdir -p "$dest"
        if unzip -q "$f" -d "$dest"; then
          echo "Extracted $f -> $dest"
        else
          echo "Failed to extract $f" >&2
          exit 1
        fi
      done

  - name: Create branch and commit extracted files
    id: commit
    run: |
      set -euo pipefail
      TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
      SHORT_SHA=$(echo "${GITHUB_SHA:-""}" | cut -c1-7)
      BRANCH="extracted-from-${SHORT_SHA}-${TIMESTAMP}"
      echo "Creating branch $BRANCH"
      git checkout -b "$BRANCH"
      git add extracted || true
      if git diff --cached --quiet; then
        echo "No extracted changes to commit."
        echo "branch_created=false" >> "$GITHUB_OUTPUT"
        exit 0
      fi
      git commit -m "Add extracted files from ZIPs (${TIMESTAMP})"
      git push --set-upstream origin "$BRANCH"
      echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
      echo "branch_created=true" >> "$GITHUB_OUTPUT"

  - name: Create Pull Request
    if: steps.commit.outputs.branch_created == 'true'
    uses: peter-evans/create-pull-request@v4
    with:
      token: ${{ secrets.GITHUB_TOKEN }}
      commit-message: "Add extracted files from ZIPs"
      branch: ${{ steps.commit.outputs.branch_name }}
      title: "Add extracted files from uploaded ZIPs"
      body: |
        This PR adds files extracted from ZIP archives uploaded to branch psicologojeffersonoliveira-ops-patch-1.
        Generated by workflow.
      labels: automated, extracted
